<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nodo del pueblo · Ina Igar</title>
  <style>
    :root {
      --fondo: #101010;
      --papel: #ffffff;
      --apagado: #b0b0b0;
      --p2p: #0b7a4b;
      --http: #a85f00;
      --linea: #e8e8e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--fondo);
      color: var(--papel);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body { display: flex; flex-direction: column; }
    header {
      flex-shrink: 0;
      padding: 12px 16px 0;
      border-bottom: 2px solid var(--p2p);
    }
    .marca {
      margin: 0;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--apagado);
    }
    h1 {
      margin: 3px 0 2px;
      font-size: 16px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .que {
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--apagado);
      max-width: 42rem;
    }
    .fila {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 8px;
      background: #1c1c1c;
      color: var(--papel);
    }
    .chip.ok { background: var(--p2p); }
    .chip.warn { background: var(--http); }
    button {
      appearance: none;
      border: 2px solid var(--papel);
      background: transparent;
      color: var(--papel);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
    }
    #ahora {
      display: none;
      flex-shrink: 0;
      padding: 8px 16px;
      background: var(--p2p);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }
    #ahora.http { background: var(--http); }
    #ahora.tel { background: #1c1c1c; }
    #log {
      flex: 1;
      overflow: auto;
      padding: 12px 16px 24px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
    }
    .vacio { color: var(--apagado); max-width: 40rem; font-family: inherit; font-size: 12px; line-height: 1.4; }
    .row { margin: 0 0 3px; white-space: pre-wrap; word-break: break-word; color: var(--linea); }
    .row.cel { color: var(--papel); }
    .tag {
      display: inline-block;
      min-width: 7.2em;
      font-size: 0.72em;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--apagado);
    }
    .row .modo {
      color: var(--apagado);
      font-weight: 600;
    }
    .row.cel .modo { color: #9ecbff; }
  </style>
</head>
<body>
  <header>
    <p class="marca">Ina Igar</p>
    <h1>Nodo del pueblo</h1>
    <p class="que">Computadora del corregimiento. El teléfono le pide MedPsy por par P2P o por HTTP. Las fotos no salen. No hay nube.</p>
    <div class="fila">
      <div class="chips">
        <span id="vivo" class="chip">conectando</span>
        <span id="par" class="chip">par P2P · —</span>
        <span id="http" class="chip">HTTP · :8788</span>
      </div>
      <button type="button" id="borrar">Borrar</button>
    </div>
  </header>
  <div id="ahora"></div>
  <main id="log"></main>
  <script>
    const logEl = document.getElementById("log");
    const ahoraEl = document.getElementById("ahora");
    const vivoEl = document.getElementById("vivo");
    const parEl = document.getElementById("par");
    const httpEl = document.getElementById("http");
    let vacio = true;

    function modoCorto(id) {
      if (id === "local-wifi") return "WiFi · modelo local";
      if (id === "local-offline") return "sin WiFi · modelo local";
      if (id === "nodo-offline") return "sin WiFi · sin capacidad";
      return "";
    }

    function parenDe(item) {
      const quien = item.origen === "cel" ? "teléfono" : "pueblo";
      const m = modoCorto(item.modo);
      return m ? `(${quien} · ${m})` : `(${quien})`;
    }

    function frase(item) {
      const l = String(item.linea ?? "").toLowerCase();
      const p = parenDe(item);
      if (l.includes("sesión"))
        return { t: "El teléfono entró " + p, k: item.modo === "local-wifi" ? "tel" : "http" };
      if (l.includes("sin capacidad") || l.includes("delegando"))
        return { t: "El teléfono delega MedPsy al nodo " + p, k: "http" };
      if (l.includes("buscando par") || l.includes("par ") && l.includes("conectando"))
        return { t: "El teléfono pide MedPsy al par P2P " + p, k: "p2p" };
      if (l.includes("par conectado") || l.includes("par generando"))
        return { t: "El par P2P corre MedPsy 1.7B Q8 " + p, k: "p2p" };
      if (l.includes("par listo"))
        return { t: "El par P2P contestó " + p, k: "p2p" };
      if (l.includes("par no respondió") || l.includes("delegate falló"))
        return { t: "El par no respondió. Pasa al pueblo por HTTP " + p, k: "http" };
      if (l.includes("cargando") && l.includes("medpsy"))
        return { t: "Cargando MedPsy 1.7B Q8 " + p, k: "http" };
      if (l.includes("generando"))
        return { t: "Generando con MedPsy 1.7B Q8 " + p, k: item.origen === "cel" ? "tel" : "http" };
      if (l.includes("modelo:"))
        return { t: String(item.linea ?? "").replace(/^\d{2}:\d{2}:\d{2}\s/, "") + " " + p, k: "http" };
      if (l.includes("/inferir") || l.includes("nodo corre") || l.includes("pedido:"))
        return { t: "El pueblo corre MedPsy 1.7B Q8 " + p, k: "http" };
      if (l.includes("listo ·") || l.includes("pueblo listo") || l.includes("pueblo infirió"))
        return { t: "MedPsy terminó " + p, k: item.origen === "cel" ? "tel" : "http" };
      if (l.includes("/solicitud") || l.includes("llegó /solicitud"))
        return { t: "Llegó una solicitud de crédito " + p, k: "http" };
      if (l.includes("en este teléfono") || l.includes("medpsy local"))
        return { t: "MedPsy corrió en el teléfono " + p, k: "tel" };
      return { t: String(item.linea ?? "").replace(/^\d{2}:\d{2}:\d{2}\s/, "") + " " + p, k: item.origen === "cel" ? "tel" : "http" };
    }

    function ponerAhora(item) {
      const f = frase(item);
      ahoraEl.style.display = "block";
      ahoraEl.textContent = f.t;
      ahoraEl.className = f.k === "http" ? "http" : f.k === "tel" ? "tel" : "";
    }

    function mostrarVacio(texto) {
      while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
      const p = document.createElement("p");
      p.className = "vacio";
      p.textContent = texto;
      logEl.appendChild(p);
      vacio = true;
      ahoraEl.style.display = "none";
    }

    function pintar(item) {
      if (vacio) {
        while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
        vacio = false;
      }
      const p = document.createElement("p");
      p.className = "row " + (item.origen === "cel" ? "cel" : "nodo");
      p.appendChild(document.createTextNode(String(item.linea ?? "")));
      const modo = document.createElement("span");
      modo.className = "modo";
      modo.textContent = " " + parenDe(item);
      p.appendChild(modo);
      logEl.appendChild(p);
      logEl.scrollTop = logEl.scrollHeight;
      ponerAhora(item);
    }

    function salud() {
      fetch("/salud").then(r => r.json()).then(d => {
        const pk = typeof d.proveedor === "string" ? d.proveedor.slice(0, 8) : "";
        parEl.textContent = pk ? "par P2P · " + pk + "…" : "par P2P · sin anunciar";
        parEl.className = "chip" + (pk ? " ok" : "");
        httpEl.textContent = "HTTP · pueblo listo";
        httpEl.className = "chip" + (d.inferir ? " ok" : "");
      }).catch(() => {});
    }

    function conectar() {
      const es = new EventSource("/consola/stream");
      es.addEventListener("open", () => {
        vivoEl.textContent = "en vivo";
        vivoEl.className = "chip ok";
      });
      es.addEventListener("snapshot", (ev) => {
        const arr = JSON.parse(ev.data);
        if (!arr.length) return;
        while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
        vacio = false;
        for (const item of arr) pintar(item);
      });
      es.addEventListener("linea", (ev) => pintar(JSON.parse(ev.data)));
      es.addEventListener("borrar", () => {
        mostrarVacio("Limpio. Esperando al teléfono…");
      });
      es.onerror = () => {
        vivoEl.textContent = "reconectando";
        vivoEl.className = "chip warn";
      };
    }

    document.getElementById("borrar").onclick = () => {
      fetch("/consola/borrar", { method: "POST" }).catch(() => {});
    };

    mostrarVacio("Esperando al teléfono. Misma WiFi. Cada línea llega con (teléfono · modo).");
    conectar();
    salud();
    setInterval(salud, 4000);
  </script>
</body>
</html>

app = "isd-hyperdht-relay"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile.relay"

[env]
  DHT_PORT = "49737"
  DHT_HOST = "fly-global-services"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[services]]
  protocol = "udp"
  internal_port = 49737
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 49737
